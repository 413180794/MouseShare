name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows-x64
          - os: macos-15
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x86_64
          - os: ubuntu-22.04
            artifact: Linux-x64
          - os: ubuntu-24.04-arm
            artifact: Linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxss-dev xvfb xauth x11-xserver-utils libx11-6 libxi6 libxtst6 libxfixes3 libxrandr2 libxss1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libegl1 libopengl0 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: Native dependency smoke test
        if: runner.os != 'Linux'
        run: |
          python -m mouseshare --smoke-test
          python -m mouseshare --drop-smoke-test
      - name: Build installer and verify bundled runtime
        if: runner.os != 'Linux'
        run: python scripts/build.py
      - name: Linux tests with isolated X11 input and clipboard
        if: runner.os == 'Linux'
        env:
          MOUSESHARE_X11_TEST: '1'
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' python -m pytest -q
      - name: Build Linux packages and verify bundled runtime
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: |
          xvfb-run -a python -m mouseshare --smoke-test
          xvfb-run -a python -m mouseshare --drop-smoke-test
          xvfb-run -a python scripts/build.py
      - name: Verify Linux package and user installer
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a /opt/mouseshare/MouseShare --smoke-test
          sudo apt-get remove -y mouseshare
          MOUSESHARE_INSTALL_ROOT="$RUNNER_TEMP/mouseshare-user" sh dist/MouseShare/install.sh
          xvfb-run -a "$RUNNER_TEMP/mouseshare-user/opt/MouseShare/MouseShare" --smoke-test
          test -f "$RUNNER_TEMP/mouseshare-user/share/applications/io.github.makesail.mouseshare.desktop"
      - name: Verify Windows installer and uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'MouseShare-Install-Test'
          $setup = Resolve-Path 'dist/MouseShare-0.7.0-Windows-x64-Setup.exe'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"", '/TASKS=""')
          $installer = Start-Process $setup -ArgumentList $arguments -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $app = Join-Path $installDir 'MouseShare.exe'
          if (!(Test-Path $app)) { throw 'Installed executable missing' }
          $smoke = Start-Process $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed app failed: $($smoke.ExitCode)" }
          $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MouseShare-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Publish preview with SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A manually published release may have already used the verified
          # main-branch artifacts. Preserve its package/checksum identities.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published; keeping verified assets."
            exit 0
          fi
          cd packages
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "MouseShare $GITHUB_REF_NAME · Preview" --prerelease \
            --notes-file ../docs/RELEASE.md ./*

